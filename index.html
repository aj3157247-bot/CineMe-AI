<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استودیو پوستر سینمایی هوش مصنوعی</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Vazirmatn', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- هدر سایت -->
    <header class="py-6 px-8 border-b border-slate-800/80 flex justify-between items-center bg-slate-900/50 backdrop-blur-md">
        <h1 class="text-xl font-extrabold tracking-wider bg-gradient-to-r from-amber-400 to-rose-500 bg-clip-text text-transparent">
            🎬 استودیو پوستر سینمایی
        </h1>
        <span class="text-xs bg-amber-500/10 text-amber-400 border border-amber-500/20 px-3 py-1 rounded-full font-semibold">نسخه وایرال v1.0</span>
    </header>

    <!-- محتوای اصلی -->
    <main class="max-w-2xl w-full mx-auto px-4 py-8 flex-grow flex flex-col items-center">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-extrabold mb-3 tracking-tight">قهرمان فیلم بعدی خودت باش!</h2>
            <p class="text-slate-400 text-sm">عکست رو آپلود کن، سبک فیلم رو انتخاب کن و پوستر خنده‌دار یا حماسی خودت رو بگیر.</p>
        </div>

        <div class="w-full bg-slate-900/80 border border-slate-800 rounded-2xl p-6 shadow-2xl backdrop-blur-sm">
            <!-- آپلود عکس -->
            <div class="mb-6">
                <label class="block text-sm font-semibold mb-2 text-slate-300">۱. انتخاب عکس چهره</label>
                <input type="file" id="uploadImage" accept="image/*" class="w-full text-sm text-slate-400 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-amber-500 file:text-slate-950 hover:file:bg-amber-400 cursor-pointer transition">
            </div>

            <!-- انتخاب سبک پوستر -->
            <div class="mb-6">
                <label class="block text-sm font-semibold mb-2 text-slate-300">۲. انتخاب ژانر فیلم</label>
                <div class="grid grid-cols-2 gap-3">
                    <button type="button" class="genre-btn border border-amber-500/50 bg-amber-500/10 text-amber-400 font-semibold py-3 px-4 rounded-xl text-sm transition text-center" data-genre="sci-fi">صاعقه در سال ۲۰۵۰ 🚀</button>
                    <button type="button" class="genre-btn border border-slate-800 bg-slate-800/50 text-slate-300 font-semibold py-3 px-4 rounded-xl text-sm transition text-center" data-genre="comedy">آخرین مجرد شهر 😂</button>
                </div>
            </div>

            <!-- دکمه ساخت -->
            <button id="generateBtn" class="w-full bg-gradient-to-r from-amber-500 to-rose-600 text-slate-950 font-ext500 font-extrabold py-3.5 px-6 rounded-xl shadow-lg hover:opacity-90 transition transform active:scale-[0.98]">
                ساخت پوستر جادویی ✨
            </button>
        </div>

        <!-- پیش‌نمایش خروجی -->
        <div id="resultContainer" class="hidden mt-8 w-full flex flex-col items-center">
            <div class="relative border-4 border-slate-800 rounded-2xl overflow-hidden shadow-2xl bg-black max-w-sm w-full">
                <canvas id="posterCanvas" class="w-full h-auto block"></canvas>
            </div>
            <a id="downloadBtn" download="cinematic-poster.png" class="mt-4 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-3 px-8 rounded-xl transition shadow-lg flex items-center gap-2">
                📥 دانلود و اشتراک‌گذاری در استوری
            </a>
        </div>
    </main>

    <!-- فوتر -->
    <footer class="py-4 text-center text-xs text-slate-500 border-t border-slate-900">
        ساخته شده برای وایرال شدن سریع در شبکه‌های اجتماعی
    </footer>

    <script src="script.js"></script>
</body>
</html>
