<!DOCTYPE html>
<html lang="fa" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineMe AI // استودیوی پیشرفته پوستر</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Vazirmatn', sans-serif; background: #030712; color: #f8fafc; }
        .glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-cyan-400 selection:text-black">

    <header class="py-4 px-6 glass sticky top-0 z-50 flex justify-between items-center border-b border-slate-800">
        <h1 class="font-black text-sm md:text-base bg-gradient-to-r from-cyan-400 to-pink-500 bg-clip-text text-transparent flex items-center gap-2">
            <i data-lucide="clapperboard" class="w-5 h-5 text-cyan-400"></i> استودیو باکس‌آفیس هوش مصنوعی
        </h1>
        <span class="text-xs bg-cyan-500/10 border border-cyan-500/30 text-cyan-400 px-3 py-1 rounded-full font-bold">نسخه ضدخطا v5.0</span>
    </header>

    <main class="max-w-xl w-full mx-auto px-4 py-8 flex-grow space-y-6">
        <div class="text-center space-y-2">
            <h2 class="text-2xl font-black tracking-tight">ستاره فیلم بعدی خودت باش!</h2>
            <p class="text-slate-400 text-xs">عکست رو انتخاب کن یا دکمه ساخت رو بزن تا فوری پوستر سینمایی ساخته بشه.</p>
        </div>

        <div class="glass p-6 rounded-3xl shadow-2xl space-y-6 border border-cyan-500/20">
            <div>
                <label class="block text-xs font-bold text-cyan-400 uppercase mb-2">۱. انتخاب عکس چهره (یا اسکرین‌شات JPG/PNG)</label>
                <input type="file" id="uploadImage" accept="image/jpeg, image/png, image/webp" class="w-full text-xs text-slate-300 file:mr-4 file:py-3 file:px-6 file:rounded-xl file:border-0 file:text-xs file:font-black file:bg-cyan-400 file:text-slate-950 hover:file:bg-cyan-300 cursor-pointer bg-slate-900/60 rounded-2xl border border-slate-800 p-2 transition">
            </div>

            <div>
                <label class="block text-xs font-bold text-cyan-400 uppercase mb-2">۲. سبک فیلم</label>
                <div class="grid grid-cols-2 gap-3">
                    <button type="button" class="genre-btn border-2 border-cyan-500 bg-cyan-500/10 text-cyan-300 font-black py-3 px-4 rounded-2xl text-xs transition text-center shadow-lg" data-genre="cyber">سایبرپانک ۲۰۷۷ 🚀</button>
                    <button type="button" class="genre-btn border-2 border-slate-800 bg-slate-900/50 text-slate-400 font-bold py-3 px-4 rounded-2xl text-xs transition text-center" data-genre="action">باکس‌آفیس اکشن 🔥</button>
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-cyan-400 uppercase mb-2">۳. نام فیلم شما (اختیاری)</label>
                <input type="text" id="customTitle" placeholder="مثلاً: هکر فراری از قانون..." class="w-full bg-slate-900 border border-slate-800 rounded-2xl px-4 py-3 text-xs text-white focus:outline-none focus:border-cyan-500 transition">
            </div>

            <button id="generateBtn" class="w-full bg-gradient-to-r from-cyan-400 via-sky-500 to-pink-500 text-slate-950 font-black py-4 px-6 rounded-2xl shadow-xl hover:opacity-95 transition transform active:scale-95 text-sm flex items-center justify-center gap-2">
                ✨ ساخت فوری پوستر سینمایی
            </button>
        </div>

        <div id="resultContainer" class="hidden glass p-6 rounded-3xl shadow-2xl flex flex-col items-center space-y-4 border border-cyan-500/30">
            <span class="text-xs font-bold text-cyan-400 uppercase tracking-widest">پوستر آماده‌ی دانلود شما 🎯</span>
            
            <div class="relative rounded-2xl overflow-hidden shadow-2xl border-2 border-slate-700 w-full max-w-[300px] aspect-[4/5] bg-black">
                <canvas id="posterCanvas" class="w-full h-full object-cover"></canvas>
            </div>

            <a id="downloadBtn" download="my-cinema-poster.png" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black py-3.5 px-6 rounded-2xl transition shadow-lg text-center text-xs flex items-center justify-center gap-2">
                📥 دانلود و اشتراک‌گذاری در استوری اینستاگرام
            </a>
        </div>
    </main>

    <footer class="py-4 text-center text-[11px] text-slate-500 border-t border-slate-900">
        سیستم پردازش هوش مصنوعی // استقرار مستقیم GitHub Pages
    </footer>

    <script>
        lucide.createIcons();
        let selectedGenre = 'cyber';
        let loadedImg = null;

        document.querySelectorAll('.genre-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.genre-btn').forEach(b => {
                    b.className = "genre-btn border-2 border-slate-800 bg-slate-900/50 text-slate-400 font-bold py-3 px-4 rounded-2xl text-xs transition text-center";
                });
                e.currentTarget.className = "genre-btn border-2 border-cyan-500 bg-cyan-500/10 text-cyan-300 font-black py-3 px-4 rounded-2xl text-xs transition text-center shadow-lg";
                selectedGenre = e.currentTarget.getAttribute('data-genre');
                if(loadedImg) generatePoster();
            });
        });

        document.getElementById('uploadImage').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    loadedImg = img;
                    generatePoster();
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(file);
        });

        document.getElementById('generateBtn').addEventListener('click', () => {
            generatePoster();
            document.getElementById('resultContainer').scrollIntoView({ behavior: 'smooth' });
        });

        function generatePoster() {
            const canvas = document.getElementById('posterCanvas');
            const ctx = canvas.getContext('2d');

            canvas.width = 1080;
            canvas.height = 1350;

            const bg = ctx.createLinearGradient(0, 0, 0, canvas.height);
            bg.addColorStop(0, '#0f172a');
            bg.addColorStop(0.5, '#030712');
            bg.addColorStop(1, '#000000');
            ctx.fillStyle = bg;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const size = 720;
            const x = (canvas.width - size) / 2;
            const y = 200;

            ctx.save();
            ctx.beginPath();
            ctx.roundRect(x, y, size, size, [40]);
            ctx.clip();

            if (loadedImg) {
                ctx.drawImage(loadedImg, x, y, size, size);
            } else {
                // اگر عکسی انتخاب نشده بود یا فرمتش خوانده نشد، یک آواتار سینمایی پیش‌فرض می‌کشد تا ارور ندهد
                ctx.fillStyle = '#1e293b';
                ctx.fillRect(x, y, size, size);
                ctx.fillStyle = '#38bdf8';
                ctx.font = '900 45px "Vazirmatn", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('🌟 عکس شما اینجا قرار می‌گیرد', canvas.width / 2, y + size / 2);
            }
            
            ctx.fillStyle = selectedGenre === 'cyber' ? 'rgba(0, 242, 254, 0.15)' : 'rgba(255, 0, 127, 0.15)';
            ctx.fillRect(x, y, size, size);
            ctx.restore();

            ctx.beginPath();
            ctx.roundRect(x, y, size, size, [40]);
            ctx.lineWidth = 10;
            ctx.strokeStyle = selectedGenre === 'cyber' ? '#00f2fe' : '#ff007f';
            ctx.stroke();

            ctx.textAlign = 'center';
            ctx.fillStyle = '#94a3b8';
            ctx.font = '700 32px "Vazirmatn", sans-serif';
            ctx.fillText('پرفروش‌ترین فیلم سال ۲۰۲۶ 🔥', canvas.width / 2, 110);

            const customVal = document.getElementById('customTitle').value.trim();
            const mainTitle = customVal !== "" ? customVal : (selectedGenre === 'cyber' ? 'هکر دنیای موازی' : 'قهرمان تاریکی');

            ctx.fillStyle = '#ffffff';
            ctx.font = '900 68px "Vazirmatn", sans-serif';
            ctx.fillText(mainTitle, canvas.width / 2, 1020);

            ctx.fillStyle = selectedGenre === 'cyber' ? '#00f2fe' : '#ff007f';
            ctx.font = '700 38px "Vazirmatn", sans-serif';
            ctx.fillText('به زودی در سینماهای آنلاین', canvas.width / 2, 1100);

            ctx.fillStyle = '#64748b';
            ctx.font = '500 26px "Vazirmatn", sans-serif';
            ctx.fillText('ساخته شده در استودیو هوش مصنوعی اختصاصی', canvas.width / 2, 1280);

            document.getElementById('resultContainer').classList.remove('hidden');
            document.getElementById('downloadBtn').href = canvas.toDataURL('image/png');
        }
    </script>
</body>
</html>
