<!DOCTYPE html>
<html lang="fa" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBERPOSTER // استودیوی عصبی باکس‌آفیس</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        neon: { cyan: '#00f2fe', pink: '#ff007f', purple: '#7928ca' }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;500;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Vazirmatn', sans-serif; background-color: #030712; color: #f8fafc; }
        .glass { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .neon-border { box-shadow: 0 0 25px rgba(0, 242, 254, 0.25); }
        .glitch-text { text-shadow: 2px 0 #ff007f, -2px 0 #00f2fe; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-neon-cyan selection:text-black">

    <!-- هدر فوق مدرن -->
    <header class="py-4 px-6 glass sticky top-0 z-50 flex justify-between items-center border-b border-slate-800">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-neon-cyan to-neon-purple flex items-center justify-center font-black text-slate-950 shadow-lg shadow-neon-cyan/30 animate-pulse">
                AI
            </div>
            <div>
                <h1 class="font-black text-base tracking-wider bg-gradient-to-r from-neon-cyan via-white to-neon-pink bg-clip-text text-transparent">
                    CYBER BOX-OFFICE
                </h1>
                <p class="text-[10px] text-slate-400 tracking-widest uppercase">نسخه نسل بعد وایرال</p>
            </div>
        </div>
        <div class="flex items-center gap-2 bg-neon-cyan/10 border border-neon-cyan/30 px-3 py-1 rounded-full text-neon-cyan text-xs font-bold">
            <i data-lucide="Flame" class="w-3.5 h-3.5"></i>
            <span>ترند جهانی</span>
        </div>
    </header>

    <!-- بدنه اصلی -->
    <main class="max-w-4xl w-full mx-auto px-4 py-8 flex-grow grid grid-cols-1 md:grid-cols-12 gap-6 items-start">
        
        <!-- پنل کنترل و تنظیمات -->
        <div class="md:col-span-6 space-y-6">
            <div class="glass p-6 rounded-3xl shadow-2xl relative overflow-hidden">
                <div class="absolute -top-20 -right-20 w-40 h-40 bg-neon-cyan/20 rounded-full blur-3xl pointer-events-none"></div>

                <h2 class="text-lg font-black mb-4 flex items-center gap-2 text-white">
                    <i data-lucide="Sliders" class="w-5 h-5 text-neon-cyan"></i>
                    انتخاب منبع تصویر
                </h2>

                <!-- تب‌های انتخاب حالت ورودی -->
                <div class="grid grid-cols-2 gap-2 mb-6 bg-slate-900/80 p-1.5 rounded-2xl border border-slate-800">
                    <button id="tabUpload" class="py-2.5 rounded-xl text-xs font-bold bg-neon-cyan text-slate-950 transition shadow-md">آپلود عکس 📁</button>
                    <button id="tabCamera" class="py-2.5 rounded-xl text-xs font-bold text-slate-400 hover:text-white transition">دوربین زنده 📸</button>
                </div>

                <!-- بخش آپلود فایل -->
                <div id="uploadSection" class="mb-6">
                    <label for="uploadImage" class="border-2 border-dashed border-slate-700 hover:border-neon-cyan bg-slate-900/50 rounded-2xl p-6 flex flex-col items-center justify-center cursor-pointer transition group">
                        <i data-lucide="UploadCloud" class="w-8 h-8 text-neon-cyan group-hover:scale-110 transition mb-2"></i>
                        <span id="fileNameDisplay" class="text-xs font-bold text-slate-300">انتخاب عکس از گالری</span>
                        <input type="file" id="uploadImage" accept="image/*" class="hidden">
                    </label>
                </div>

                <!-- بخش دوربین زنده -->
                <div id="cameraSection" class="mb-6 hidden flex flex-col items-center">
                    <div class="relative w-full aspect-[4/3] bg-black rounded-2xl overflow-hidden border border-slate-700 mb-3">
                        <video id="webcam" autoplay playsinline class="w-full h-full object-cover"></video>
                    </div>
                    <button id="captureBtn" class="w-full bg-neon-pink text-white font-bold py-2.5 rounded-xl text-xs shadow-lg shadow-neon-pink/30 flex items-center justify-center gap-2">
                        <i data-lucide="Camera" class="w-4 h-4"></i> ثبت عکس سلفی فوری
                    </button>
                    <canvas id="snapshotCanvas" class="hidden"></canvas>
                </div>

                <!-- انتخاب جهان سینمایی -->
                <div class="mb-6">
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-2">جهان سینمایی</label>
                    <div class="grid grid-cols-2 gap-2">
                        <button type="button" class="genre-btn border border-neon-cyan bg-neon-cyan/10 text-neon-cyan font-bold py-2.5 px-3 rounded-xl text-xs transition flex items-center justify-center gap-1.5" data-genre="cyber">
                            <i data-lucide="Cpu" class="w-3.5 h-3.5"></i> سایبرپانک ۲۰۷۷
                        </button>
                        <button type="button" class="genre-btn border border-slate-800 bg-slate-900/50 text-slate-400 font-bold py-2.5 px-3 rounded-xl text-xs transition flex items-center justify-center gap-1.5" data-genre="action">
                            <i data-lucide="Flame" class="w-3.5 h-3.5"></i> اکشن هالیوودی
                        </button>
                    </div>
                </div>

                <!-- عنوان سفارشی فیلم -->
                <div class="mb-6">
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-2">نام سفارشی فیلم شما</label>
                    <input type="text" id="customTitleInput" placeholder="مثلا: آخرین برنامه‌نویس بیدار..." class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-neon-cyan transition">
                </div>

                <!-- دکمه رندر نهایی -->
                <button id="generateBtn" class="w-full bg-gradient-to-r from-neon-cyan via-sky-400 to-neon-purple text-slate-950 font-black py-3.5 px-6 rounded-2xl shadow-xl shadow-neon-cyan/20 hover:opacity-95 transition transform active:scale-95 flex items-center justify-center gap-2 text-sm">
                    <i data-lucide="Sparkles" class="w-5 h-5"></i>
                    تولید پوستر وایرال 🚀
                </button>
            </div>
        </div>

        <!-- پنل خروجی و پیش‌نمایش -->
        <div class="md:col-span-6 flex flex-col items-center">
            <div class="w-full glass p-6 rounded-3xl shadow-2xl flex flex-col items-center relative">
                
                <div id="loadingOverlay" class="absolute inset-0 bg-slate-950/90 backdrop-blur-md rounded-3xl z-20 flex flex-col items-center justify-center hidden">
                    <div class="w-12 h-12 border-4 border-neon-cyan/20 border-t-neon-cyan rounded-full animate-spin mb-3"></div>
                    <p id="loadingStatus" class="text-xs font-mono text-neon-cyan animate-pulse">تزریق هوش مصنوعی به فریم...</p>
                </div>

                <div class="w-full flex justify-between items-center mb-4">
                    <span class="text-xs font-bold text-slate-400 uppercase">پیش‌نمایش استوری</span>
                    <span class="text-[10px] bg-slate-800 px-2.5 py-1 rounded-md text-neon-cyan font-mono">1080x1350</span>
                </div>

                <!-- بوم پیش‌نمایش گرافیکی -->
                <div class="relative rounded-2xl overflow-hidden shadow-2xl border border-slate-800 w-full max-w-[280px] aspect-[4/5] bg-black">
                    <canvas id="posterCanvas" class="w-full h-full object-cover"></canvas>
                </div>

                <!-- دکمه‌های عملیاتی خروجی -->
                <div id="actionButtons" class="w-full mt-6 space-y-2.5 hidden">
                    <a id="downloadBtn" download="viral-cyber-poster.png" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold py-3 px-4 rounded-xl transition shadow-lg flex items-center justify-center gap-2 text-xs">
                        <i data-lucide="Download" class="w-4 h-4"></i> دانلود پوستر با کیفیت عالی
                    </a>
                    <button id="shareBtn" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold py-2.5 px-4 rounded-xl transition flex items-center justify-center gap-2 text-xs">
                        <i data-lucide="Share2" class="w-4 h-4 text-neon-cyan"></i> اشتراک‌گذاری مستقیم (Web Share)
                    </button>
                </div>
            </div>
        </div>
    </main>

    <footer class="py-4 text-center text-xs text-slate-600 border-t border-slate-900 glass">
        قدرت‌گرفته از گیت‌هاب اکشنز و موتور گرافیکی HTML5 Canvas
    </footer>

    <script>lucide.createIcons();</script>

    <!-- موتور جاوا اسکریپت پیشرفته -->
    <script>
        let selectedGenre = 'cyber';
        let uploadedImageObj = null;
        let mediaStream = null;

        // تب‌ها
        const tabUpload = document.getElementById('tabUpload');
        const tabCamera = document.getElementById('tabCamera');
        const uploadSection = document.getElementById('uploadSection');
        const cameraSection = document.getElementById('cameraSection');
        const webcam = document.getElementById('webcam');

        tabUpload.addEventListener('click', () => {
            tabUpload.className = "py-2.5 rounded-xl text-xs font-bold bg-neon-cyan text-slate-950 transition shadow-md";
            tabCamera.className = "py-2.5 rounded-xl text-xs font-bold text-slate-400 hover:text-white transition";
            uploadSection.classList.remove('hidden');
            cameraSection.classList.add('hidden');
            stopCamera();
        });

        tabCamera.addEventListener('click', async () => {
            tabCamera.className = "py-2.5 rounded-xl text-xs font-bold bg-neon-pink text-white transition shadow-md";
            tabUpload.className = "py-2.5 rounded-xl text-xs font-bold text-slate-400 hover:text-white transition";
            cameraSection.classList.remove('hidden');
            uploadSection.classList.add('hidden');
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
                webcam.srcObject = mediaStream;
            } catch (err) {
                alert('دسترسی به دوربین برقرار نشد یا پشتیبانی نمی‌شود.');
            }
        });

        function stopCamera() {
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }
        }

        document.getElementById('captureBtn').addEventListener('click', () => {
            const canvasSnap = document.getElementById('snapshotCanvas');
            canvasSnap.width = webcam.videoWidth || 640;
            canvasSnap.height = webcam.videoHeight || 480;
            const ctxSnap = canvasSnap.getContext('2d');
            ctxSnap.drawImage(webcam, 0, 0);
            
            const img = new Image();
            img.onload = () => {
                uploadedImageObj = img;
                renderPreview(img, selectedGenre);
                alert('عکس سلفی با موفقیت ثبت شد!');
            };
            img.src = canvasSnap.toDataURL('image/png');
        });

        document.getElementById('uploadImage').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                document.getElementById('fileNameDisplay').textContent = file.name;
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        uploadedImageObj = img;
                        renderPreview(img, selectedGenre);
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        document.querySelectorAll('.genre-btn').forEach(button => {
            button.addEventListener('click', (e) => {
                document.querySelectorAll('.genre-btn').forEach(btn => {
                    btn.className = "genre-btn border border-slate-800 bg-slate-900/50 text-slate-400 font-bold py-2.5 px-3 rounded-xl text-xs transition flex items-center justify-center gap-1.5";
                });
                const target = e.currentTarget;
                target.className = "genre-btn border border-neon-cyan bg-neon-cyan/10 text-neon-cyan font-bold py-2.5 px-3 rounded-xl text-xs transition flex items-center justify-center gap-1.5";
                selectedGenre = target.getAttribute('data-genre');
                if (uploadedImageObj) renderPreview(uploadedImageObj, selectedGenre);
            });
        });

        document.getElementById('generateBtn').addEventListener('click', () => {
            if (!uploadedImageObj) {
                alert('لطفاً ابتدا تصویر خود را بارگذاری یا ثبت کنید!');
                return;
            }

            const loading = document.getElementById('loadingOverlay');
            const status = document.getElementById('loadingStatus');
            loading.classList.remove('hidden');

            const steps = [
                "پردازش عمیق لندمارک‌های چهره...",
                "اعمال گرید نوری باکس‌آفیس...",
                "رندر نهایی لایه‌های وایرال..."
            ];

            let i = 0;
            const interval = setInterval(() => {
                if (i < steps.length) {
                    status.textContent = steps[i];
                    i++;
                } else {
                    clearInterval(interval);
                    loading.classList.add('hidden');
                    renderPreview(uploadedImageObj, selectedGenre, true);
                    document.getElementById('actionButtons').classList.remove('hidden');
                }
            }, 500);
        });

        function renderPreview(img, genre, isFinal = false) {
            const canvas = document.getElementById('posterCanvas');
            const ctx = canvas.getContext('2d');

            canvas.width = 1080;
            canvas.height = 1350;

            // گرادینت پس‌زمینه
            const bgGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            bgGrad.addColorStop(0, '#0f172a');
            bgGrad.addColorStop(0.5, '#030712');
            bgGrad.addColorStop(1, '#000000');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // تصویر اصلی کاربر داخل کادر نئونی
            const imgSize = 750;
            const imgX = (canvas.width - imgSize) / 2;
            const imgY = 200;

            ctx.save();
            ctx.beginPath();
            ctx.roundRect(imgX, imgY, imgSize, imgSize, [40]);
            ctx.clip();
            ctx.drawImage(img, imgX, imgY, imgSize, imgSize);
            
            // فیلتر رنگی
            ctx.fillStyle = genre === 'cyber' ? 'rgba(0, 242, 254, 0.12)' : 'rgba(255, 0, 127, 0.12)';
            ctx.fillRect(imgX, imgY, imgSize, imgSize);
            ctx.restore();

            // بورد نئونی دور عکس
            ctx.beginPath();
            ctx.roundRect(imgX, imgY, imgSize, imgSize, [40]);
            ctx.lineWidth = 10;
            ctx.strokeStyle = genre === 'cyber' ? '#00f2fe' : '#ff007f';
            ctx.stroke();

            // متن‌ها
            ctx.textAlign = 'center';
            ctx.fillStyle = '#94a3b8';
            ctx.font = '700 32px "Vazirmatn", sans-serif';
            ctx.fillText('پرفروش‌ترین فیلم سال ۲۰۲۶ 🔥', canvas.width / 2, 110);

            const customInput = document.getElementById('customTitleInput').value.trim();
            const mainTitle = customInput !== "" ? customInput : (genre === 'cyber' ? 'هکر نسل آینده' : 'قهرمان تاریکی');

            ctx.fillStyle = '#ffffff';
            ctx.font = '900 68px "Vazirmatn", sans-serif';
            ctx.fillText(mainTitle, canvas.width / 2, 1030);

            ctx.fillStyle = genre === 'cyber' ? '#00f2fe' : '#ff007f';
            ctx.font = '700 38px "Vazirmatn", sans-serif';
            ctx.fillText('به زودی در سینماهای آنلاین جهان', canvas.width / 2, 1110);

            // فوتر
            ctx.fillStyle = '#64748b';
            ctx.font = '500 24px "Vazirmatn", sans-serif';
            ctx.fillText('CYBER-AI LAB // استودیوی رسمی پوستر', canvas.width / 2, 1280);

            if (isFinal) {
                const dataURL = canvas.toDataURL('image/png');
                document.getElementById('downloadBtn').href = dataURL;
            }
        }

        document.getElementById('shareBtn').addEventListener('click', async () => {
            const canvas = document.getElementById('posterCanvas');
            canvas.toBlob(async (blob) => {
                const file = new File([blob], 'cyber-poster.png', { type: 'png' });
                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    try {
                        await navigator.share({
                            title: 'پوستر سینمایی من',
                            text: 'ببین چه پوستر خفنی با هوش مصنوعی ساختم! تو هم امتحان کن 🔥',
                            files: [file]
                        });
                    } catch (err) { console.log(err); }
                } else {
                    alert('مرورگر شما از اشتراک‌گذاری مستقیم پشتیبانی نمی‌کند. لطفاً از دکمه دانلود استفاده کنید.');
                }
            });
        });
    </script>
</body>
</html>
